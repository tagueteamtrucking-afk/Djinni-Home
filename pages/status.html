<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Fairies of Avalon — Live Status</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:24px; background:#0b0f17; color:#e9eef5; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .card { background:#111827; border:1px solid #1f2937; border-radius:16px; padding:20px; max-width: 820px; }
  h1 { margin: 0 0 12px 0; font-size: 24px; }
  .ok { color:#7ff085; }
  .warn { color:#ffd166; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  button { margin-top:12px; padding:8px 12px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:#e9eef5; cursor:pointer; }
  button:hover { background:#111827; }
</style>
</head>
<body>
  <div class="card">
    <h1>Fairies of Avalon — Live Status</h1>
    <div id="summary">Loading…</div>
    <pre id="raw" class="mono" style="white-space:pre-wrap;word-break:break-word;margin-top:12px;"></pre>
    <button id="refresh">Refresh</button>
  </div>

<script>
const HEARTBEAT_URL = `${location.origin}${location.pathname.replace(/\\/[^/]*$/, '/')}`.replace(/\\/pages\\/.*$/, '/') + 'data/heartbeat.json';

async function load() {
  const ui = document.getElementById('summary');
  const raw = document.getElementById('raw');
  try {
    const res = await fetch('/Djinni-Home/data/heartbeat.json?nocache=' + Date.now(), { cache: 'no-store' })
      .catch(()=> fetch('data/heartbeat.json?nocache=' + Date.now(), { cache: 'no-store' }));
    if (!res || !res.ok) throw new Error('No heartbeat found');
    const json = await res.json();
    const t = new Date(json.generated_at).toLocaleString('en-US', { timeZone: 'America/Chicago' });
    ui.innerHTML = `<strong>Engine:</strong> <span class="ok">alive</span> · <strong>Last tick:</strong> ${t}`;
    raw.textContent = JSON.stringify(json, null, 2);
  } catch (e) {
    ui.innerHTML = `<strong>Engine:</strong> <span class="warn">waiting for first tick…</span><br/>Once the workflow runs, this page will show a timestamp.`;
    raw.textContent = '';
  }
}
document.getElementById('refresh').onclick = load;
load();
</script>
</body>
</html>
