<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Room</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.5/lib/three-vrm.module.js"
  }
}
</script>

  <link rel="stylesheet" href="../asset/css/style.css"/>
  <script defer src="../asset/js/config.js"></script>
</head>
<body>
  <div class="topbar"><a href="./index.html">← Plaza</a></div>
  <canvas id="scene"></canvas>
  <div id="hud">Booting…</div>
  <div class="panel">
    <div class="row"><label>Model (.vrm)</label><select id="model"></select></div>
    <div class="row"><label>Wings (.fbx/.glb)</label><select id="wings"></select></div>
    <div class="row" style="gap:8px;margin-top:4px">
      <button id="reloadBtn">Reload</button>
      <button id="clearBtn">Clear Wings</button>
    </div>
    <hr/>
    <div class="row"><label>Off X</label><input id="offX" type="range" min="-1.5" max="1.5" step="0.01" value="0"></div>
    <div class="row"><label>Off Y</label><input id="offY" type="range" min="-1.5" max="1.5" step="0.01" value="0.9"></div>
    <div class="row"><label>Off Z</label><input id="offZ" type="range" min="-1.5" max="1.5" step="0.01" value="-0.1"></div>
    <div class="row"><label>Scale</label><input id="scale" type="range" min="0.1" max="3" step="0.01" value="1.0"></div>
    <div class="row"><label>Rot X</label><input id="rotX" type="range" min="-3.14" max="3.14" step="0.01" value="0"></div>
    <div class="row"><label>Rot Y</label><input id="rotY" type="range" min="-3.14" max="3.14" step="0.01" value="0"></div>
    <div class="row"><label>Rot Z</label><input id="rotZ" type="range" min="-3.14" max="3.14" step="0.01" value="0"></div>
  </div>
  <script type="module">
    import { createViewer } from '../asset/js/vrm-viewer.js';
    import { hud, setOptions } from '../asset/js/util.js';
    const backend = window.BACKEND_URL.replace(/\/$/, '');
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || 'abbey';

    const canvas = document.getElementById('scene');
    const v = createViewer(canvas);

    const modelSel = document.getElementById('model');
    const wingsSel = document.getElementById('wings');
    const reloadBtn = document.getElementById('reloadBtn');
    const clearBtn = document.getElementById('clearBtn');

    async function loadLists(){
      const [m,w] = await Promise.all([
        fetch(backend+'/assets/models').then(r=>r.json()),
        fetch(backend+'/assets/wings').then(r=>r.json())
      ]);
      setOptions(modelSel, m.models||[]);
      setOptions(wingsSel, w.wings||[]);
    }

    async function setupRoom(){
      // try to get room data
      try {
        const r = await fetch(backend + '/rooms/' + id).then(r=>r.json());
        if (r.vrm) {
          await v.loadVRM(backend + '/' + r.vrm.replace(/^\//,''));
        }
        document.title = r.title || document.title;
        document.body.style.background = `linear-gradient(120deg, ${r.bg?.[0]||'#101018'}, ${r.bg?.[1]||'#181826'})`;
      } catch(e) {
        hud('Room fetch failed, loading first model after lists.');
      }
    }

    modelSel.addEventListener('change', async ()=>{
      const url = modelSel.value;
      if (!url) return;
      await v.loadVRM(url.startsWith('http') ? url : backend + '/' + url.replace(/^\//,''));
      if (v.wing) v.attachWing();
    });
    wingsSel.addEventListener('change', async ()=>{
      const url = wingsSel.value;
      if (!url) return;
      await v.loadWing(url.startsWith('http') ? url : backend + '/' + url.replace(/^\//,''));
      v.attachWing();
      applyTransform();
    });
    reloadBtn.addEventListener('click', loadLists);
    clearBtn.addEventListener('click', ()=>{ if (v.wing?.parent) v.wing.parent.remove(v.wing); hud('Wings cleared.'); });

    function applyTransform(){
      v.applyTransform({
        offX: parseFloat(offX.value),
        offY: parseFloat(offY.value),
        offZ: parseFloat(offZ.value),
        scale: parseFloat(scale.value),
        rx: parseFloat(rotX.value),
        ry: parseFloat(rotY.value),
        rz: parseFloat(rotZ.value),
      });
    }
    ['offX','offY','offZ','scale','rotX','rotY','rotZ'].forEach(id=>document.getElementById(id).addEventListener('input', applyTransform));

    await loadLists();
    await setupRoom();
    // fallback: if no room VRM loaded, auto-load first available model
    if (!v.vrm && modelSel.options.length) await v.loadVRM(modelSel.value.startsWith('http') ? modelSel.value : backend + '/' + modelSel.value.replace(/^\//,''));
    if (wingsSel.options.length) { await v.loadWing(wingsSel.value.startsWith('http') ? wingsSel.value : backend + '/' + wingsSel.value.replace(/^\//,'')); v.attachWing(); }
    hud('Room ready.');
  </script>
</body>
</html>
