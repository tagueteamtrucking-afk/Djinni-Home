<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Wings Lab — VRM + FBX</title>
  <style>
    html,body{height:100%;margin:0;background:#0b0d12;color:#e6e9ef;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    #ui{position:fixed;top:8px;left:8px;background:#12151c;border:1px solid #1e2230;border-radius:10px;padding:10px;z-index:10}
    .row{margin-bottom:8px;font-size:13px}
    canvas{width:100vw;height:100vh;display:block}
    label{display:block;margin-bottom:4px}
    input[type=range]{width:200px}
  </style>
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/",
      "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.3/lib/three-vrm.module.js"
    }
  }
  </script>
</head>
<body>
<div id="ui">
  <div class="row"><b>1) Load VRM</b><br/><input type="file" id="vrmFile" accept=".vrm"/></div>
  <div class="row"><b>2) Load Wings (FBX)</b><br/><input type="file" id="wingsFile" accept=".fbx"/></div>
  <div class="row"><b>Texture (optional)</b><br/><input type="file" id="texFile" accept=".png,.jpg,.jpeg,.webp"/></div>
  <div class="row"><b>Transform</b><br/>
    X <input id="tx" type="range" min="-1" max="1" step="0.01" value="0"/>
    Y <input id="ty" type="range" min="-1" max="1" step="0.01" value="0.5"/>
    Z <input id="tz" type="range" min="-1" max="1" step="0.01" value="-0.1"/><br/>
    Scale <input id="s" type="range" min="0.1" max="3" step="0.01" value="1"/>
  </div>
  <div class="row"><button id="save">Save Offsets</button> <span id="msg"></span></div>
</div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { VRM, VRMLoaderPlugin } from '@pixiv/three-vrm';
import 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d12);
const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0,1.4,2.5);
const controls = new OrbitControls(camera, renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(1,1,1);
scene.add(light, new THREE.AmbientLight(0xffffff, 0.3));

const loader = new THREE.GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));
const fbxLoader = new FBXLoader();

let currentVRM = null;
let wings = null;

function attachWingsToSpine(vrm, wingsObj){
  const bone = vrm.humanoid.getBoneNode(VRM.BoneName.Hips) || vrm.scene; // fallback
  bone.add(wingsObj);
  syncTransform();
}

function syncTransform(){
  if(!wings) return;
  wings.position.set(parseFloat(tx.value), parseFloat(ty.value), parseFloat(tz.value));
  wings.scale.setScalar(parseFloat(scale.value));
}

function animate(){
  requestAnimationFrame(animate);
  if (currentVRM) currentVRM.update(1/60);
  renderer.render(scene, camera);
}
animate();

const vrmFile = document.getElementById('vrmFile');
const wingsFile = document.getElementById('wingsFile');
const texFile = document.getElementById('texFile');
const tx = document.getElementById('tx');
const ty = document.getElementById('ty');
const tz = document.getElementById('tz');
const scale = document.getElementById('s');
const saveBtn = document.getElementById('save');
const msg = document.getElementById('msg');

vrmFile.onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const array = await file.arrayBuffer();
  loader.parse(array, '', (gltf)=>{
    currentVRM = gltf.userData.vrm;
    scene.add(currentVRM.scene);
    if (wings) attachWingsToSpine(currentVRM, wings);
  }, (err)=>console.error(err));
};

wingsFile.onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const url = URL.createObjectURL(file);
  wings = await fbxLoader.loadAsync(url);
  wings.traverse(o=>{ if(o.isMesh){ o.material = new THREE.MeshBasicMaterial({color:0xffffff}); } });
  if(currentVRM){ attachWingsToSpine(currentVRM, wings); } else { scene.add(wings); syncTransform(); }
};

texFile.onchange = async (e)=>{
  if(!wings) return;
  const file = e.target.files[0]; if(!file) return;
  const url = URL.createObjectURL(file);
  const tex = new THREE.TextureLoader().load(url);
  wings.traverse(o=>{ if(o.isMesh){ o.material.map = tex; o.material.needsUpdate = true; } });
};

[tx,ty,tz,scale].forEach(input=> input.addEventListener('input', syncTransform));

saveBtn.onclick = ()=>{
  const data = { x: parseFloat(tx.value), y: parseFloat(ty.value), z: parseFloat(tz.value), s: parseFloat(scale.value) };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'wings_offsets.json'; a.click();
  msg.textContent = 'Saved wings_offsets.json';
};
</script>
</body>
</html>
