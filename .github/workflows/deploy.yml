name: Deploy
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Permission request id (approved)"
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install Overseers CLI
        working-directory: overseers
        run: npm ci

      - name: Build approval artifact
        working-directory: overseers
        run: |
          npm run build
          node dist/cli.js artifact --id "${{ github.event.inputs.request_id }}"

      - name: Check approval artifact (two-person rule)
        id: check
        run: |
          ART="overseers/approval-artifact_${{ github.event.inputs.request_id }}.json"
          if [ ! -f "$ART" ]; then
            echo "Artifact not found: $ART" >&2
            exit 1
          fi
          OK=$(jq -r '.ok' "$ART")
          if [ "$OK" != "true" ]; then
            echo "Two-person approval not satisfied for $ART" >&2
            exit 1
          fi
          echo "Approvals OK."

      - name: Deploy (placeholder)
        run: echo "🚀 Deploying…"
