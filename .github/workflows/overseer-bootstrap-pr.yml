name: Overseer Bootstrap PR
on:
  workflow_dispatch:
    inputs:
      branch_suffix:
        description: "Short name for the branch (e.g. init, labels, seeds)"
        required: false
        default: "init"
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  make-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute branch name
        id: vars
        run: |
          ts="$(date +%Y%m%d-%H%M%S)"
          suffix="${{ github.event.inputs.branch_suffix }}"
          [ -z "$suffix" ] && suffix="init"
          echo "branch=overseer/${suffix}-${ts}" >> $GITHUB_OUTPUT
      - name: Create seed change
        run: |
          mkdir -p overseer
          printf "# Overseer seed\n\nCreated: $(date -u)\n" > overseer/SEED.md
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.vars.outputs.branch }}"
          git add -A
          git commit -m "chore(overseer): bootstrap seed"
          git push --set-upstream origin "${{ steps.vars.outputs.branch }}"
      - name: Open PR
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          gh pr create \
            --title "Overseer: bootstrap seed" \
            --body "Automated bootstrap PR to verify Overseer flow." \
            --base "${{ github.ref_name }}" \
            --head "${{ steps.vars.outputs.branch }}"
