name: Overseer Issue Trigger
on:
  issues:
    types: [labeled, opened, edited]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  from-issue:
    if: >
      contains(github.event.issue.labels.*.name, 'overseer') &&
      contains(github.event.issue.labels.*.name, 'needs-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive branch name
        id: vars
        run: |
          num="${{ github.event.issue.number }}"
          slug="$(echo "${{ github.event.issue.title }}" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9-_')"
          [ -z "$slug" ] && slug="overseer-task"
          ts="$(date +%Y%m%d-%H%M%S)"
          echo "branch=overseer/issue-${num}-${slug}-${ts}" >> $GITHUB_OUTPUT
      - name: Materialize issue
        run: |
          mkdir -p overseer/issues
          {
            echo "# Overseer Task"
            echo
            echo "Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
            echo
            echo "----"
            echo
            echo "${{ github.event.issue.body }}"
          } > "overseer/issues/issue-${{ github.event.issue.number }}.md"
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.vars.outputs.branch }}"
          git add -A
          git commit -m "chore(overseer): materialize issue #${{ github.event.issue.number }}"
          git push --set-upstream origin "${{ steps.vars.outputs.branch }}"
      - name: Open PR
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          gh pr create \
            --title "Overseer: implement #${{ github.event.issue.number }}" \
            --body "Automated PR generated from labeled issue #${{ github.event.issue.number }}." \
            --base "${{ github.ref_name }}" \
            --head "${{ steps.vars.outputs.branch }}"
      - name: Comment back
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          pr_url="$(gh pr view --json url -q .url)"
          gh issue comment ${{ github.event.issue.number }} --body "✅ Bootstrap PR opened: ${pr_url}"
