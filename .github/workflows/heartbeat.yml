name: Site Heartbeat
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:         # manual "Run workflow" button
permissions:
  contents: write
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write heartbeat
        run: |
          mkdir -p data
          cat > data/heartbeat.json << 'EOF'
          {
            "name": "fairies-of-avalon",
            "component": "heartbeat",
            "generated_at": "__STAMP__",
            "notes": "If this timestamp updates, your engine is alive."
          }
          EOF
          sed -i "s/__STAMP__/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" data/heartbeat.json
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heartbeat.json
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "chore(heartbeat): tick"
            git push
          fi
