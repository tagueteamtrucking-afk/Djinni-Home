
<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Diagnostics — Djinni</title>
<link rel="stylesheet" href="./style.css"/></head>
<body>
<header><h1>Diagnostics</h1><p>Charlotte & Clarice — import maps, .nojekyll, and asset paths.</p></header>
<div class="grid" id="out"></div>
<script>
async function check(){
  const out=document.getElementById('out');
  const card=(t,h)=>{const d=document.createElement('div');d.className='card';d.innerHTML='<h2>'+t+'</h2>'+h;out.appendChild(d);};

  // .nojekyll
  let nojekyll='unknown'; try{const r=await fetch('/.nojekyll'); nojekyll=r.ok?'present':'missing';}catch(e){nojekyll='check skipped';}
  card('.nojekyll', '<p>Status: <b>'+nojekyll+'</b></p><p>Correct filename is <code>.nojekyll</code> (leading dot), placed at repo root.</p>');

  // Import map presence on Wings Lab
  try{const r=await fetch('./pages/wings-lab.html'); const t=await r.text(); const ok=t.includes('type="importmap"')&&t.includes('@pixiv/three-vrm'); card('Import Map (Wings Lab)', '<p>'+(ok?'OK':'MISSING')+'</p>');}catch(e){card('Import Map (Wings Lab)','<p>Error fetching page.</p>');}

  // Asset healthcheck
  try{const r=await fetch('./asset/healthcheck.txt'); card('Assets', '<p>'+ (r.ok?'asset/healthcheck.txt is present':'not found') +'</p>');}catch(e){card('Assets','<p>Error reading asset/healthcheck.txt</p>');}

  card('Advice','<ul><li>If import map is missing, copy the block from Wings Lab into the page head.</li><li>Match three + @pixiv/three-vrm versions.</li><li>Check case-sensitive file paths on GitHub Pages.</li></ul>');
}
check();
</script></body></html>
